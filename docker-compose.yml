version: '3.8'

services:
  central:
    build: .
    ports:
      - "5000:5000"
    volumes:
      # Monta la carpeta local ./data en /app/data del contenedor para que la BD no se borre
      - ./data:/app/data
    depends_on:
      - kafka

  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"

  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      # ADVERTENCIA: En tu ordenador esto es localhost. 
      # En la nube, esto debe ser la IP/Dominio público del servidor.
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
    depends_on:
      - zookeeper