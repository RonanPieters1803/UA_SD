version: '3.8'

x-env: &common-env
  KAFKA_HOST: zephyr.proxy.rlwy.net
  KAFKA_PORT: "12362"
  CENTRAL_HOST: caboose.proxy.rlwy.net
  CENTRAL_PORT: "53982"

services:
  # ================= ESTACIÓN 1 =================
  monitor-1:
    build: .
    container_name: monitor_ws_1
    command: python WM_WS_M.py 6000 caboose.proxy.rlwy.net 53982 WS_1 "Parque de las Palmeras"
    restart: unless-stopped

  engine-1:
    build: .
    container_name: engine_ws_1
    stdin_open: true  
    tty: true         
    depends_on:
      - monitor-1
    command: python WM_WS_E.py zephyr.proxy.rlwy.net 12362 monitor-1 6000 15.5
    restart: unless-stopped

