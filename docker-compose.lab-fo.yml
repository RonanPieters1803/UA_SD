x-fo: &fo
  build: ./WM_FO
  network_mode: host
  stdin_open: true
  tty: true
  restart: unless-stopped

services:
  fo-1:
    <<: *fo
    container_name: fo_op1
    command: ["${KAFKA_HOST}:${KAFKA_PORT}", "op1", "--file", "/app/servicios.txt"]
    volumes:
      - ./WM_FO/servicios.txt:/app/servicios.txt:ro

  fo-2:
    <<: *fo
    container_name: fo_op2
    command: ["${KAFKA_HOST}:${KAFKA_PORT}", "op2"]

  fo-3:
    <<: *fo
    container_name: fo_op3
    command: ["${KAFKA_HOST}:${KAFKA_PORT}", "op3"]

  fo-4:
    <<: *fo
    container_name: fo_op4
    command: ["${KAFKA_HOST}:${KAFKA_PORT}", "op4"]

  fo-5:
    <<: *fo
    container_name: fo_op5
    command: ["${KAFKA_HOST}:${KAFKA_PORT}", "op5"]

  fo-6:
    <<: *fo
    container_name: fo_op6
    command: ["${KAFKA_HOST}:${KAFKA_PORT}", "op6"]